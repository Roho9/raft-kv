services:
  node1:
    build: .
    command: ["--id", "1", "--peers", "1=node1:7001,2=node2:7002,3=node3:7003", "--data-dir", "/data"]
    ports:
      - "7001:7001"
    volumes:
      - node1-data:/data
  node2:
    build: .
    command: ["--id", "2", "--peers", "1=node1:7001,2=node2:7002,3=node3:7003", "--data-dir", "/data"]
    ports:
      - "7002:7002"
    volumes:
      - node2-data:/data
  node3:
    build: .
    command: ["--id", "3", "--peers", "1=node1:7001,2=node2:7002,3=node3:7003", "--data-dir", "/data"]
    ports:
      - "7003:7003"
    volumes:
      - node3-data:/data

volumes:
  node1-data:
  node2-data:
  node3-data:
