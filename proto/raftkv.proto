syntax = "proto3";

package raftkv;

option go_package = "github.com/Roho9/raft-kv/gen/raftkvpb";

// ---------------- Raft internal RPCs ----------------

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Fast conflict backoff hints (Raft paper section 5.3 optimization).
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ---------------- Client-facing KV service ----------------

// Command is the payload replicated through the Raft log. Every client
// operation, including reads, is replicated so results are linearizable.
message Command {
  enum Op {
    PUT = 0;
    DELETE = 1;
    GET = 2;
  }
  Op op = 1;
  string key = 2;
  bytes value = 3;
  // Client session identity for exactly-once (idempotent) application.
  string client_id = 4;
  uint64 seq = 5;
}

message GetRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  string client_id = 3;
  uint64 seq = 4;
}

message PutResponse {}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 seq = 3;
}

message DeleteResponse {
  bool existed = 1;
}

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
